name: postgres-lab

services:
  postgres:
    image: postgres:16
    container_name: pg-lab
    ports:
      # 宿主机用 15432，避免与其他 PostgreSQL 实例冲突
      - "15432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      TZ: Asia/Shanghai
    volumes:
      - pg_lab_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pg_lab_data:
    name: pg_lab_data
