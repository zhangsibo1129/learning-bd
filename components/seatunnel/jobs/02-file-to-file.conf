env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    plugin_output = "employees"
    path = "/data/input/employees.csv"
    file_format_type = "csv"
    delimiter = ","
    skip_header_row_number = 1
    schema {
      fields {
        id = "int"
        name = "string"
        city = "string"
        salary = "double"
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "employees"
    plugin_output = "high_salary"
    query = "select id, name, city, salary from employees where salary >= 10000"
  }
}

sink {
  LocalFile {
    plugin_input = "high_salary"
    path = "/data/output/high_salary"
    file_format_type = "json"
  }
}
