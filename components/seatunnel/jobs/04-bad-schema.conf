env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/data/input/employees.csv"
    file_format_type = "csv"
    delimiter = ","
    skip_header_row_number = 1
    schema {
      fields {
        id = "int"
        # 故意写错：name 实际是中文姓名，无法转成 int
        name = "int"
        city = "string"
        salary = "double"
      }
    }
  }
}

sink {
  Console {}
}
