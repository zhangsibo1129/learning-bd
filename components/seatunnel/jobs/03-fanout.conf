env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    plugin_output = "employees"
    path = "/data/input/employees.csv"
    file_format_type = "csv"
    delimiter = ","
    skip_header_row_number = 1
    schema {
      fields {
        id = "int"
        name = "string"
        city = "string"
        salary = "double"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "employees"
  }

  LocalFile {
    plugin_input = "employees"
    path = "/data/output/fanout"
    file_format_type = "json"
  }
}
