name: openfga-lab

services:
  openfga:
    image: openfga/openfga:latest
    container_name: openfga-lab
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_PLAYGROUND_ADDR: 0.0.0.0:3000
    ports:
      - "18080:8080"   # HTTP API
      - "13000:3000"   # Playground

  cli:
    profiles: ["cli"]
    image: openfga/cli:latest
    environment:
      FGA_API_URL: http://openfga:8080
    depends_on:
      - openfga
    volumes:
      - ./model:/model:ro

volumes: {}
