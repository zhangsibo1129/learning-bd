name: ontology-demo

services:
  postgres:
    image: postgres:16
    container_name: ontology-postgres
    environment:
      POSTGRES_DB: ontology_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动时按文件名顺序执行，仅初始化空数据卷
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d ontology_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: ontology_postgres_data
