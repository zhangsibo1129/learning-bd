name: ontology-demo

services:
  postgres:
    image: postgres:16
    container_name: ontology-postgres
    environment:
      POSTGRES_DB: ontology_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动时按文件名顺序执行，仅初始化空数据卷
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d ontology_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ontology-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    container_name: ontology-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # 阶段 2 起使用：定期把 PostgreSQL 设备表全量同步到 Kafka
  seatunnel:
    image: apache/seatunnel:2.3.9
    container_name: ontology-seatunnel
    profiles: ["phase2"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./seatunnel/jobs:/opt/seatunnel/jobs:ro
    command:
      - bash
      - -c
      - |
        while true; do
          ./bin/seatunnel.sh --config /opt/seatunnel/jobs/pg_equipment_to_kafka.conf -m local
          echo "[sync] batch finished at $(date -Iseconds), sleep 20s"
          sleep 20
        done
    restart: unless-stopped

  # 阶段 3 起使用：以 SQL 批作业方式消费 Kafka 并写入 Iceberg
  flink-sql:
    build: ./flink
    image: ontology-flink:1.20
    container_name: ontology-flink-sql
    profiles: ["phase3"]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    command:
      [
        "/opt/flink/bin/sql-client.sh",
        "embedded",
        "-Dexecution.target=local",
        "-f",
        "/opt/flink/sql/phase3_ingest.sql",
      ]

volumes:
  postgres_data:
    name: ontology_postgres_data
  rustfs_data:
    name: ontology_rustfs_data
