# 阶段 2：PostgreSQL equipment 表 -> Kafka equipment-events
# 运行方式：./bin/seatunnel.sh --config /opt/seatunnel/jobs/pg_equipment_to_kafka.conf -m local

env {
  parallelism = 1
  job.mode = "BATCH"
  job.name = "pg-equipment-to-kafka"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgres:5432/ontology_demo"
    driver = "org.postgresql.Driver"
    user = "demo"
    password = "demo123"
    query = """
      SELECT id,
             name,
             model,
             factory_id,
             status,
             to_char(created_at, 'YYYY-MM-DD HH24:MI:SS') AS created_at,
             to_char(now(), 'YYYY-MM-DD HH24:MI:SS')       AS synced_at
      FROM equipment
    """
    fetch_size = 1000
  }
}

sink {
  Kafka {
    bootstrap.servers = "kafka:9094"
    topic = "equipment-events"
    format = "json"
    kafka_config {
      acks = "all"
    }
  }
}
